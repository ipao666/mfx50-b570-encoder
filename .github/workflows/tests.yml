name: Checks

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
      - name: Compile Python files
        run: |
          python -m py_compile tools\run_gpu_h265_benchmark.py
          python -m py_compile tools\run_rate_distortion_benchmark.py
          python -m py_compile src\nvenc_benchmark.py
          python -m py_compile src\multi_source_benchmark.py
          python -m py_compile src\mixed_concurrency_test.py
