<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">GPU H.265 benchmark summary</title>
  <desc id="desc">Summary chart showing 31.27 percent size reduction, -0.001814 SSIM delta, and -0.974 dB PSNR delta.</desc>
  <rect width="920" height="360" fill="#f7f8fb"/>
  <text x="40" y="54" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#111827">GPU H.265 Rate-Distortion Benchmark</text>
  <text x="40" y="86" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4b5563">10 real 5-minute video samples, concurrent NVENC encoding</text>
  <g transform="translate(40,125)">
    <rect width="260" height="165" rx="8" fill="#ffffff" stroke="#d1d5db"/>
    <text x="22" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4b5563">Mean size reduction</text>
    <text x="22" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" fill="#047857">31.27%</text>
    <rect x="22" y="116" width="210" height="14" rx="7" fill="#d1fae5"/>
    <rect x="22" y="116" width="66" height="14" rx="7" fill="#10b981"/>
  </g>
  <g transform="translate(330,125)">
    <rect width="260" height="165" rx="8" fill="#ffffff" stroke="#d1d5db"/>
    <text x="22" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4b5563">Mean SSIM delta</text>
    <text x="22" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" fill="#1f2937">-0.0018</text>
    <text x="22" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#6b7280">Small average quality change</text>
  </g>
  <g transform="translate(620,125)">
    <rect width="260" height="165" rx="8" fill="#ffffff" stroke="#d1d5db"/>
    <text x="22" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4b5563">Mean PSNR delta</text>
    <text x="22" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" fill="#1f2937">-0.974 dB</text>
    <text x="22" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#6b7280">Reported beside compression gain</text>
  </g>
  <text x="40" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#6b7280">Baseline: hevc_nvenc p4 cq=28. Improved: hevc_nvenc p7 cq=34 with spatial/temporal AQ.</text>
</svg>
